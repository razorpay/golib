name: Run Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  test:
    runs-on: [ self-hosted, non-api ]
    strategy:
      max-parallel: 4
      matrix:
        go-version: ["^1.25.0", "^1.26.0"]

    name: Run Tests
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: setup golang
        uses: actions/setup-go@v5
        with:
          go-version: '${{ matrix.go-version }}'

      - run: sh ./run_tests.sh
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GOPRIVATE: github.com/razorpay/*

      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
