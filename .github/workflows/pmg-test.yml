name: PMG Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pmg-test.yml'

permissions:
  contents: read

jobs:
  pmg-verify:
    runs-on: [ self-hosted, non-api ]
    name: PMG Verification
    steps:
      - name: checkout
        uses: actions/checkout@v2

      - name: setup golang
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.0'

      - name: Setup PMG proxy
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Install Go modules through PMG
        working-directory: ./opentelemetry
        run: go mod download
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GOPRIVATE: github.com/razorpay/*

      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
